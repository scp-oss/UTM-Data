{{define "content"}}
<div class="card" style="max-width:480px;">
  <strong>{{if .UTM}}Изменить УТМ{{else}}Добавить УТМ{{end}}</strong>
  <form method="post" action="{{if .UTM}}/utm/{{.UTM.ID}}/edit{{else}}/utm/new{{end}}">
    <label for="label">Название (произвольное, необязательно)</label>
    <input type="text" id="label" name="label" value="{{if .UTM}}{{.UTM.Label}}{{end}}" placeholder="например, Магазин на Ленина">

    <label for="ip">IP-адрес УТМ</label>
    <input type="text" id="ip" name="ip" value="{{if .UTM}}{{.UTM.IPAddress}}{{end}}" placeholder="192.168.1.10" required {{if .UTM}}readonly{{end}}>
    <div class="hint">ИНН, название организации, адрес установки и сроки действия сертификатов будут получены автоматически при опросе.</div>

    <label for="port">Порт</label>
    <input type="number" id="port" name="port" value="{{if .UTM}}{{.UTM.Port}}{{else}}8080{{end}}" min="1" max="65535">

    <div style="margin-top:20px; display:flex; gap:8px;">
      <button class="btn" type="submit">{{if .UTM}}Сохранить{{else}}Добавить и опросить{{end}}</button>
      <a class="btn secondary" href="/">Отмена</a>
    </div>
  </form>
</div>
{{end}}
